services:
  - type: web
    name: chinar-agro-ai-api
    env: python
    buildCommand: "pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn ai_api.api:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 65"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PYTHONIOENCODING
        value: utf-8
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: ENABLE_CLIP
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
    plan: free


